name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python test_counter.py

      - name: Download models
        run: python -c "from ultralytics import YOLO; YOLO('yolo11n.pt'); YOLO('yolo11s.pt')"

      - name: Self-test from source
        run: |
          python app.py --selftest
          $code = $LASTEXITCODE
          Get-Content selftest.log
          if ($code -ne 0) { exit 1 }

      - name: Build exe
        run: >
          pyinstaller --noconfirm --windowed --name VehicleCounter
          --collect-all ultralytics --collect-all torchvision --hidden-import lap app.py

      - name: Add models and docs
        run: |
          Copy-Item yolo11n.pt, yolo11s.pt, README.md dist\VehicleCounter\

      - name: Self-test of built exe
        run: |
          $p = Start-Process dist\VehicleCounter\VehicleCounter.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\VehicleCounter\selftest.log
          Remove-Item dist\VehicleCounter\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Zip
        run: 7z a -tzip -mx=5 VehicleCounter-windows.zip .\dist\VehicleCounter

      - uses: actions/upload-artifact@v4
        with:
          name: VehicleCounter-windows
          path: VehicleCounter-windows.zip
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest VehicleCounter-windows.zip --title "VehicleCounter (Windows)" --notes "Распакуйте архив и запустите VehicleCounter.exe"
